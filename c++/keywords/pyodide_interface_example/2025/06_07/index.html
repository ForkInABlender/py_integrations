<script>
  async function boot() {
    window.pyodide = await loadPyodide({
      indexURL: "https://cdn.jsdelivr.net/pyodide/v0.25.1/full/"
    });
    await window.pyodide.loadPackage(['requests']);
    brython(); // boot Brython after Pyodide init
  }

  boot();
</script>
